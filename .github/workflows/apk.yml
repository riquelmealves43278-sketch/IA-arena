name: Gerar APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: mkdir www && cp index.html app.js worker.js core.js binjgb.js binjgb.wasm sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png www/
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0F1412' --iconBackgroundColorDark '#0F1412'
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: ia-arena-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
