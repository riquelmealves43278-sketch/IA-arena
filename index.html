<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1412">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>IA Arena</title>
<style>
:root{--bg:#0F1412;--card:#18201C;--line:#26332B;--txt:#E8F0EA;--mut:#9FB0A5;--acc:#7CE3A1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 0}
main{padding:20px 20px 90px;display:flex;flex-direction:column;gap:14px}h1{margin:0;font-size:22px}p{margin:4px 0 0;color:var(--mut);font-size:13px}
button{font:inherit;min-height:44px;border-radius:12px;border:1px solid #3A4A41;background:transparent;color:var(--txt);font-weight:600;padding:0 14px}
button.pri{background:var(--acc);color:var(--bg);border:0}.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;min-height:40px;color:var(--mut)}.seg button.on{background:var(--acc);color:var(--bg)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
canvas{width:100%;aspect-ratio:10/9;border-radius:8px;background:#9bbc0f;image-rendering:pixelated}#grid.off canvas{display:none}
.tile b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile span{font-size:12px;color:var(--mut)}
.row{display:flex;gap:6px}.row button{flex:1;min-height:40px;font-size:13px;padding:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;color:var(--mut)}nav button.on{color:var(--acc)}
.card{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}label.c{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--txt);min-height:44px}
input[type=text],input[type=file]{min-height:44px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}input[type=range]{accent-color:var(--acc)}
dialog{background:var(--card);color:var(--txt);border:0;border-radius:16px;width:min(92vw,380px)}dialog::backdrop{background:#000a}
#live{position:fixed;inset:0;background:var(--bg);z-index:9;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
#live[hidden]{display:none}#lc{width:min(100%,60vh*1.11);aspect-ratio:10/9;image-rendering:pixelated;background:#9bbc0f;border-radius:8px}
[hidden]{display:none!important}
</style></head><body>
<main id="arena"><div><h1>IA Arena</h1><p id="sum">Nenhum agente ainda</p></div>
<div class="seg" id="mode"><button data-m="visual">Visual</button><button data-m="offline">Offline</button></div>
<div id="grid"></div><button id="add">Adicionar agente</button></main>
<main id="cfg" hidden><div><h1>Ajustes</h1><p>Desempenho e uso do aparelho</p></div>
<div class="card"><label for="snap" id="snapl">Atualizar quadro a cada 2 s (modo visual)</label><input id="snap" type="range" min="1" max="10" value="2">
<label class="c"><input type="checkbox" id="wake">Manter a tela ligada</label>
<button id="pause">Pausar treino</button></div>
<div class="card"><p>Treino: rede neural pequena evoluída por tentativa e erro. Recompensa: telas diferentes alcançadas, mais um endereço de memória opcional por agente.</p></div></main>
<nav><button data-v="arena" class="on">Arena</button><button data-v="cfg">Ajustes</button></nav>
<dialog id="dlg"><div class="card" style="background:none"><h1 style="font-size:18px">Novo agente</h1>
<label>ROM (.gb / .gbc)<input type="file" id="rom" accept=".gb,.gbc,.bin"></label>
<label>Endereço de RAM da pontuação (opcional, hex)<input type="text" id="addr" placeholder="ex: C0A0" inputmode="text"></label>
<button class="pri" id="go">Iniciar treino</button><button id="no">Cancelar</button></div></dialog>
<div id="live" hidden><canvas id="lc" width="160" height="144"></canvas><p id="lt"></p>
<div class="row" style="width:min(100%,360px)"><button id="snd" style="flex:1">Som: desligado</button><button id="cl" style="flex:1">Fechar</button></div></div>
<script src="app.js"></script></body></html>
